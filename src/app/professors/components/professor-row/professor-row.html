<article class="grid gap-3 border-b border-slate-100 px-4 py-4 last:border-b-0 sm:px-5 md:grid-cols-[minmax(220px,1.3fr)_minmax(180px,1fr)_minmax(140px,1fr)_110px_88px] md:items-center md:gap-4 dark:border-slate-900">
  <div class="flex min-w-0 items-center gap-3">
    <hlm-avatar class="size-10 shrink-0">
      <span hlmAvatarFallback class="bg-cyan-100 text-xs font-semibold text-cyan-900 dark:bg-cyan-950 dark:text-cyan-200">{{ initials() }}</span>
    </hlm-avatar>
    <div class="min-w-0">
      <p class="truncate text-sm font-medium text-slate-900 dark:text-slate-100">{{ fullName() }}</p>
      <p class="mt-0.5 text-xs text-slate-500 md:hidden">{{ professor().subject }} · {{ professor().classroom }}</p>
    </div>
  </div>
  <div class="min-w-0 space-y-1 text-xs text-slate-600 dark:text-slate-400">
    <p class="flex min-w-0 items-center gap-2"><ng-icon name="lucideMail" class="size-3.5 shrink-0" /><span class="truncate">{{ professor().email }}</span></p>
    <p class="flex items-center gap-2"><ng-icon name="lucidePhone" class="size-3.5 shrink-0" /><span>{{ professor().phone || 'Sem telefone' }}</span></p>
  </div>
  <div class="hidden min-w-0 text-xs md:block">
    <p class="truncate font-medium text-slate-800 dark:text-slate-200">{{ professor().subject }}</p>
    <p class="mt-1 text-slate-500 dark:text-slate-400">{{ professor().classroom }}</p>
  </div>
  <p>
    <span class="inline-flex items-center gap-1.5 text-xs font-medium" [class.text-emerald-700]="professor().status === 'Ativo'" [class.text-slate-500]="professor().status === 'Inativo'" [class.dark:text-emerald-300]="professor().status === 'Ativo'" [class.dark:text-slate-400]="professor().status === 'Inativo'">
      <span class="size-1.5 rounded-full" [class.bg-emerald-500]="professor().status === 'Ativo'" [class.bg-slate-400]="professor().status === 'Inativo'"></span>
      {{ professor().status }}
    </span>
  </p>
  <div class="flex justify-end gap-1 border-t border-slate-100 pt-2 md:border-0 md:pt-0 dark:border-slate-900">
    <button hlmBtn variant="ghost" type="button" class="size-8 rounded-md p-0 text-slate-600 hover:text-cyan-800" [attr.aria-label]="'Editar ' + fullName()" (click)="edit.emit()">
      <ng-icon name="lucidePencil" class="size-4" />
    </button>
    <button hlmBtn variant="ghost" type="button" class="size-8 rounded-md p-0 text-slate-600 hover:bg-rose-50 hover:text-rose-700 dark:hover:bg-rose-950" [attr.aria-label]="'Excluir ' + fullName()" (click)="delete.emit(professor())">
      <ng-icon name="lucideTrash2" class="size-4" />
    </button>
  </div>
</article>
