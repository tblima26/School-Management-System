<div class="flex h-10 items-center">
  <button
    hlmBtn
    variant="ghost"
    class="h-12 gap-3 rounded-sm"
    [hlmDropdownMenuTrigger]="profileMenu"
    aria-label="Abrir menu do perfil"
  >
    <hlm-avatar class="size-9">
      <span hlmAvatarFallback>JS</span>
    </hlm-avatar>

    <span class="hidden text-left sm:block">
      <span class="block text-xs font-medium">João Silva</span>
      <span class="block text-[0.6rem] text-muted-foreground">Administrador</span>
    </span>
  </button>

  <ng-template #profileMenu>
    <hlm-dropdown-menu>
      <button hlmDropdownMenuItem>
        <ng-icon name="lucideUserRound" class="mr-2 size-4" />
        Meu perfil
      </button>

      <button hlmDropdownMenuItem>
        <ng-icon name="lucideSettings" class="mr-2 size-4" />
        Configurações
      </button>
      <button hlmDropdownMenuItem>
        <ng-icon name="lucideLogOut" class="mr-2 size-4" />
        Sair da conta
      </button>
    </hlm-dropdown-menu>
  </ng-template>
</div>
