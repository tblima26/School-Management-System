
<button
  hlmBtn
  variant="ghost"
  size="icon"
  class="size-10 shrink-0"
  type="button"
  (click)="toggleTheme()"
  [attr.aria-label]="isDark() ? 'Ativar tema claro' : 'Ativar tema escuro'"
>
  @if (isDark()) {
    <ng-icon name="lucideSun" size="20" />
  } @else {
    <ng-icon name="lucideMoon" size="20" />
  }
</button>
