<article class="flex flex-col gap-3 border-b border-slate-100 px-5 py-4 last:border-b-0 sm:flex-row sm:items-center sm:justify-between dark:border-slate-900">
  <div class="min-w-0">
    <h2 class="break-words text-sm font-medium text-slate-900 dark:text-slate-100">{{ course().name }}</h2>
    @if (course().description) {
      <p class="mt-1 whitespace-pre-line break-words text-xs text-slate-500 dark:text-slate-400">{{ course().description }}</p>
    } @else {
      <p class="mt-1 text-xs text-slate-400 dark:text-slate-500">Sem descrição</p>
    }
  </div>
  <div class="flex justify-end gap-1 border-t border-slate-100 pt-2 sm:shrink-0 sm:border-0 sm:pt-0 dark:border-slate-900">
    <button hlmBtn variant="ghost" type="button" class="size-8 rounded-md p-0 text-slate-600 hover:text-cyan-800" [attr.aria-label]="'Editar ' + course().name" (click)="edit.emit()">
      <ng-icon name="lucidePencil" class="size-4" />
    </button>
    <button hlmBtn variant="ghost" type="button" class="size-8 rounded-md p-0 text-slate-600 hover:bg-rose-50 hover:text-rose-700 dark:hover:bg-rose-950" [attr.aria-label]="'Excluir ' + course().name" (click)="delete.emit(course())">
      <ng-icon name="lucideTrash2" class="size-4" />
    </button>
  </div>
</article>
