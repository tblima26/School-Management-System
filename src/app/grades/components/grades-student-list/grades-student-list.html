<div class="surface mt-5 overflow-hidden rounded-lg">
  <div class="flex flex-col justify-between gap-3 border-b border-slate-200 px-5 py-4 sm:flex-row sm:items-center dark:border-slate-800">
    <div>
      <h2 class="text-sm font-semibold text-slate-950 dark:text-white">Alunos da turma</h2>
      <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">{{ subject() }} · {{ classroom() }} · 30 alunos</p>
    </div>
    <div class="flex flex-col gap-2 sm:items-end">
      <button hlmBtn type="button" class="h-8 shrink-0 gap-1.5 rounded-md bg-emerald-700 px-2.5 text-xs text-white hover:bg-emerald-800" (click)="approveAll()">
        <ng-icon name="lucideCheck" class="size-3.5" />
        Aprovar todos
      </button>
      <button hlmBtn variant="outline" type="button" class="h-8 shrink-0 gap-1.5 rounded-md px-2.5 text-xs text-slate-600 hover:text-rose-700 dark:text-slate-300" (click)="clearGrades()">
        <ng-icon name="lucideRotateCcw" class="size-3.5" />
        Limpar tudo
      </button>
    </div>
  </div>

  <div class="max-h-120 overflow-y-auto">
    @for (student of demoStudents; track student.id) {
      <div class="grid grid-cols-[2.5rem_minmax(0,1fr)_minmax(9rem,11rem)] items-center gap-3 border-b border-slate-100 px-5 py-3 last:border-0 dark:border-slate-800">
        <span class="text-xs tabular-nums text-slate-400">{{ student.id.toString().padStart(2, '0') }}</span>
        <span class="min-w-0 truncate text-sm font-medium text-slate-800 dark:text-slate-200">{{ student.name }}</span>
        <select
          class="surface h-9 min-w-0 rounded-md px-2 text-xs outline-none focus:border-cyan-700 focus:ring-2 focus:ring-cyan-700/20"
          [attr.aria-label]="'Situação de ' + student.name"
          [ngModel]="gradeStatuses()[student.id] ?? ''"
          (ngModelChange)="setGradeStatus(student.id, $event)"
        >
          <option value="" disabled>Selecione</option>
          <option value="Aprovado">Aprovado</option>
          <option value="Reprovado">Reprovado</option>
          <option value="Recuperação">Recuperação</option>
        </select>
      </div>
    }
  </div>

  <div class="flex flex-col justify-between gap-3 border-t border-slate-200 px-5 py-4 sm:flex-row sm:items-center dark:border-slate-800">
    <p class="text-xs text-slate-500 dark:text-slate-400">Preencha a situação dos 30 alunos para liberar o lançamento demonstrativo.</p>
    <button
      hlmBtn
      type="button"
      class="h-9 shrink-0 gap-2 rounded-md bg-cyan-800 text-white hover:bg-cyan-900"
      [disabled]="!canSave()"
      (click)="saveGrades()"
    >
      <ng-icon name="lucideCheck" class="size-4" />
      Salvar lançamentos
    </button>
  </div>
</div>
