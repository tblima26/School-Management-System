<div class="fixed inset-0 z-50 grid place-items-center overflow-y-auto bg-slate-950/50 p-4" (click)="close()">
  <section role="dialog" aria-modal="true" aria-labelledby="student-dialog-title" class="surface my-auto w-full max-w-xl rounded-lg shadow-2xl dark:border-slate-700" (click)="$event.stopPropagation()">
    <div class="flex items-start justify-between border-b border-slate-200 px-6 py-5 dark:border-slate-800">
      <div>
        <h2 id="student-dialog-title" class="text-lg font-semibold text-slate-950 dark:text-white">
          {{ student ? 'Editar aluno' : 'Novo aluno' }}
        </h2>
        <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">Preencha os dados do cadastro.</p>
      </div>
      <button hlmBtn variant="ghost" type="button" class="size-8 rounded-md p-0" aria-label="Fechar formulário" (click)="close()">
        <ng-icon name="lucideX" class="size-4" />
      </button>
    </div>

    <form #studentEditor="ngForm" (ngSubmit)="submit()">
      <div class="grid gap-4 px-6 py-5 sm:grid-cols-2">
        <label class="grid gap-1.5 text-xs font-medium text-slate-700 dark:text-slate-300">
          Nome
          <input hlmInput name="firstName" [(ngModel)]="form.firstName" required maxlength="60" class="h-10" />
        </label>
        <label class="grid gap-1.5 text-xs font-medium text-slate-700 dark:text-slate-300">
          Sobrenome
          <input hlmInput name="lastName" [(ngModel)]="form.lastName" required maxlength="80" class="h-10" />
        </label>
        <label class="grid gap-1.5 text-xs font-medium text-slate-700 dark:text-slate-300 sm:col-span-2">
          E-mail
          <input hlmInput type="email" name="email" [(ngModel)]="form.email" required email class="h-10" />
        </label>
        <label class="grid gap-1.5 text-xs font-medium text-slate-700 dark:text-slate-300">
          Telefone
          <input hlmInput type="tel" name="phone" [(ngModel)]="form.phone" required class="h-10" />
        </label>
        <label class="grid gap-1.5 text-xs font-medium text-slate-700 dark:text-slate-300">
          Idade
          <input hlmInput type="number" name="age" [(ngModel)]="form.age" required min="1" max="120" class="h-10" />
        </label>
        <label class="grid gap-1.5 text-xs font-medium text-slate-700 dark:text-slate-300 sm:col-span-2">
          Instituição
          <input hlmInput name="university" [(ngModel)]="form.university" required maxlength="120" class="h-10" />
        </label>
        <label class="grid gap-1.5 text-xs font-medium text-slate-700 dark:text-slate-300">
          Situação da matrícula
          <select name="status" [(ngModel)]="form.status" class="surface h-10 rounded-md px-3 text-sm font-normal outline-none focus:border-cyan-700 focus:ring-2 focus:ring-cyan-700/20 dark:border-slate-700">
            <option value="Ativo">Ativo</option>
            <option value="Inativo">Inativo</option>
          </select>
        </label>
      </div>

      @if (errorMessage) {
        <p role="alert" class="mx-6 mb-4 text-xs text-rose-700 dark:text-rose-300">{{ errorMessage }}</p>
      }

      <div class="flex justify-end gap-2 border-t border-slate-200 px-6 py-4 dark:border-slate-800">
        <button hlmBtn variant="outline" type="button" class="h-9 rounded-md" (click)="close()">Cancelar</button>
        <button hlmBtn type="submit" class="h-9 min-w-28 rounded-md bg-cyan-800 text-white hover:bg-cyan-900" [disabled]="studentEditor.invalid || saving">
          {{ saving ? 'Salvando...' : student ? 'Salvar alterações' : 'Cadastrar aluno' }}
        </button>
      </div>
    </form>
  </section>
</div>
