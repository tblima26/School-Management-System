<article class="grid gap-3 border-b border-slate-100 px-4 py-4 last:border-b-0 sm:px-5 md:grid-cols-[minmax(220px,1.3fr)_minmax(200px,1fr)_minmax(160px,1fr)_90px_110px_88px] md:items-center md:gap-4 dark:border-slate-900">
  <div class="flex min-w-0 items-center gap-3">
    <span class="grid size-10 shrink-0 place-items-center rounded-full bg-cyan-100 text-xs font-semibold text-cyan-900 dark:bg-cyan-950 dark:text-cyan-200">{{ initials() }}</span>
    <div class="min-w-0">
      <p class="truncate text-sm font-medium text-slate-900 dark:text-slate-100">{{ fullName() }}</p>
      <p class="mt-0.5 text-xs text-slate-500 md:hidden">{{ student().age }} anos</p>
    </div>
  </div>
  <div class="min-w-0 space-y-1 text-xs text-slate-600 dark:text-slate-400">
    <p class="flex min-w-0 items-center gap-2"><ng-icon name="lucideMail" class="size-3.5 shrink-0" /><span class="truncate">{{ student().email }}</span></p>
    <p class="flex items-center gap-2"><ng-icon name="lucidePhone" class="size-3.5 shrink-0" /><span>{{ student().phone || 'Sem telefone' }}</span></p>
  </div>
  <p class="flex items-center gap-2 text-xs text-slate-700 dark:text-slate-300"><ng-icon name="lucideBuilding2" class="size-3.5 shrink-0 text-slate-400" /><span class="truncate">{{ student().university || 'Não informada' }}</span></p>
  <p class="hidden text-sm text-slate-600 md:block dark:text-slate-400">{{ student().age }} anos</p>
  <p>
    <span class="inline-flex items-center gap-1.5 text-xs font-medium" [class.text-emerald-700]="student().status === 'Ativo'" [class.text-slate-500]="student().status === 'Inativo'" [class.dark:text-emerald-300]="student().status === 'Ativo'" [class.dark:text-slate-400]="student().status === 'Inativo'">
      <span class="size-1.5 rounded-full" [class.bg-emerald-500]="student().status === 'Ativo'" [class.bg-slate-400]="student().status === 'Inativo'"></span>
      {{ student().status }}
    </span>
  </p>
  <div class="flex justify-end gap-1 border-t border-slate-100 pt-2 md:border-0 md:pt-0 dark:border-slate-900">
    <button hlmBtn variant="ghost" type="button" class="size-8 rounded-md p-0 text-slate-600 hover:text-cyan-800" [attr.aria-label]="'Editar ' + fullName()" (click)="edit.emit()">
      <ng-icon name="lucidePencil" class="size-4" />
    </button>
    <button hlmBtn variant="ghost" type="button" class="size-8 rounded-md p-0 text-slate-600 hover:bg-rose-50 hover:text-rose-700 dark:hover:bg-rose-950" [attr.aria-label]="'Excluir ' + fullName()" (click)="delete.emit(student())">
      <ng-icon name="lucideTrash2" class="size-4" />
    </button>
  </div>
</article>
