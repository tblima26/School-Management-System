<div class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-center">
  <div class="relative min-w-0 flex-1">
    <ng-icon name="lucideSearch" class="pointer-events-none absolute left-3 top-1/2 size-4 -translate-y-1/2 text-slate-400" />
    <input
      hlmInput
      type="search"
      [placeholder]="searchPlaceholder()"
      [attr.aria-label]="'Buscar ' + entity()"
      class="h-10 w-full pl-9"
      [ngModel]="searchTerm()"
      (ngModelChange)="searchTermChange.emit($event)"
    />
  </div>
  <label class="sr-only" for="status-filter">Filtrar por situação</label>
  <select
    id="status-filter"
    class="surface h-10 min-w-40 rounded-md px-3 text-sm text-slate-700 outline-none focus:border-cyan-700 focus:ring-2 focus:ring-cyan-700/20 dark:border-slate-700 dark:text-slate-200"
    [ngModel]="statusFilter()"
    (ngModelChange)="statusFilterChange.emit($event)"
  >
    <option value="Todos">Todas as situações</option>
    <option value="Ativo">Ativos</option>
    <option value="Inativo">Inativos</option>
  </select>
</div>
